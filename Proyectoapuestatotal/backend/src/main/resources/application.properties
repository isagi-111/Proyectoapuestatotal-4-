# Configuración por defecto (entorno de DESARROLLO).
# En producción TODO lo sensible se entrega por variables de entorno (APUESTATOTAL_*),
# nunca se escribe en este archivo ni en el repositorio.
app.env=dev
server.port=8080
db.url=jdbc:h2:mem:apuestatotal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
# Origen permitido para CORS (por ejemplo el Live Server de VS Code)
cors.origin=http://localhost:5500
# DNI del administrador inicial (vacío = no se crea ninguno)
admin.dni=
# Dinero SIMULADO de bienvenida
wallet.initial=1000.00
session.ttl.minutes=120
login.max.failures=5
login.window.minutes=15
register.max=10
register.window.minutes=60
