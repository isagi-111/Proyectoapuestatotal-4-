<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Apuesta Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rojo: #E3242B;
    --coral: #F2867E;
    --coral-dark: #EC6F65;
    --negro: #17161B;
    --negro-suave: #2A2930;
    --gris-borde: #E3E2E6;
    --gris-fondo: #F6F5F7;
    --texto: #1B1A1F;
    --texto-sec: #6F6E76;
    --blanco: #FFFFFF;
    --radio: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    color:var(--texto);
    background:var(--blanco);
  }
  .marca{
    display:flex;
    align-items:center;
    gap:.5rem;
    padding:1.25rem 1.5rem .5rem;
  }
  .marca a{
    display:flex;
    align-items:center;
    gap:.4rem;
    color:var(--rojo);
    text-decoration:none;
    font-family:'Anton', sans-serif;
    font-size:1.1rem;
    letter-spacing:.02em;
  }
  .marca svg{width:20px;height:20px;flex:none;}

  .contenedor{
    max-width:540px;
    margin:0 auto;
    padding:0 1.5rem 3rem;
  }

  /* --- Hero ilustrado (reemplaza foto real por composición propia) --- */
  .hero{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    aspect-ratio:16/9;
    background:
      radial-gradient(circle at 78% 15%, rgba(226,55,68,.55), transparent 45%),
      linear-gradient(135deg, #241D22 0%, #171418 55%, #100E11 100%);
    margin-bottom:2rem;
  }
  .hero svg{position:absolute; inset:0; width:100%; height:100%;}
  .hero-etiqueta{
    position:absolute;
    left:1.25rem;
    bottom:1.1rem;
    color:var(--blanco);
    font-family:'Anton', sans-serif;
    font-size:clamp(1.1rem, 4vw, 1.6rem);
    letter-spacing:.03em;
    text-transform:uppercase;
    line-height:1.1;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .hero-etiqueta span{color:var(--coral);}

  h1.titulo{
    font-family:'Anton', sans-serif;
    font-size:1.6rem;
    letter-spacing:.04em;
    text-align:center;
    margin:0 0 1.5rem;
  }

  .aviso-exito{
    font-size:.82rem; color:#0F6E56; background:#EAF7F4;
    border:1px solid #BFE8DF; border-radius:8px; padding:.6rem .8rem;
    margin-bottom:1rem; display:none;
  }
  .aviso-exito.visible{display:block;}
  .mensaje-error{
    font-size:.82rem; color:var(--rojo); background:#FDEDEE;
    border:1px solid #F6C9CB; border-radius:8px; padding:.6rem .8rem;
    margin-bottom:1rem; display:none;
  }
  .mensaje-error.visible{display:block;}

  form{display:flex; flex-direction:column; gap:1rem;}

  .campo{
    display:flex;
    align-items:center;
    gap:.75rem;
    border:1.5px solid var(--gris-borde);
    border-radius:10px;
    padding:.7rem .9rem;
    background:var(--blanco);
  }
  .campo:focus-within{border-color:var(--rojo);}
  .campo .icono{
    width:34px; height:34px; flex:none;
    border-radius:50%;
    background:var(--gris-fondo);
    display:flex; align-items:center; justify-content:center;
    color:var(--texto-sec);
  }
  .campo input{
    border:0; outline:0; flex:1;
    font:inherit; font-size:.95rem;
    background:transparent;
    color:var(--texto);
  }
  .campo input::placeholder{color:var(--texto-sec);}
  .campo button.ver{
    background:none; border:0; cursor:pointer;
    color:var(--texto-sec); padding:0; display:flex;
  }

  .olvide{
    text-align:right;
    font-size:.85rem;
  }
  .olvide a{color:var(--texto); text-decoration:underline; text-underline-offset:2px;}

  .btn{
    display:block;
    text-align:center;
    border:0;
    cursor:pointer;
    padding:.95rem 1rem;
    font-family:'Anton', sans-serif;
    letter-spacing:.06em;
    font-size:1rem;
    text-transform:uppercase;
    text-decoration:none;
    clip-path:polygon(2.2% 0, 100% 0, 97.8% 100%, 0 100%);
    transition:filter .15s ease, transform .15s ease;
  }
  .btn:hover{filter:brightness(1.05); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primario{background:var(--coral); color:var(--blanco);}
  .btn-primario:hover{background:var(--coral-dark);}
  .btn-secundario{background:var(--negro); color:var(--blanco);}

  .separador{
    display:flex; align-items:center; gap:.85rem;
    color:var(--texto-sec); font-size:.85rem;
    margin:.5rem 0;
  }
  .separador::before, .separador::after{
    content:""; flex:1; height:1px; background:var(--gris-borde);
  }

  .aviso-legal{
    text-align:center;
    font-size:.72rem;
    color:var(--texto-sec);
    margin-top:1.75rem;
    line-height:1.5;
  }
</style>
</head>
<body>

  <div class="marca">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
      Inicio
    </a>
  </div>

  <div class="contenedor">

    <div class="hero" aria-hidden="true">
      <svg viewBox="0 0 540 304" preserveAspectRatio="xMidYMid slice">
        <circle cx="470" cy="60" r="120" fill="#E3242B" opacity=".18"/>
        <circle cx="60" cy="260" r="90" fill="#F2867E" opacity=".12"/>
        <!-- balón estilizado -->
        <g transform="translate(270 150)">
          <circle r="46" fill="#F6F5F7"/>
          <path d="M0 -46 L27 -28 17 4 -17 4 -27 -28 Z" fill="#17161B" opacity=".9"/>
          <path d="M27 -28 L46 -10 40 22 17 4Z" fill="#2A2930" opacity=".55"/>
          <path d="M-27 -28 L-46 -10 -40 22 -17 4Z" fill="#2A2930" opacity=".55"/>
        </g>
      </svg>
      <div class="hero-etiqueta">Para ganar,<br><span>hay que creer</span></div>
    </div>

    <h1 class="titulo">INICIAR SESIÓN</h1>

    <div class="aviso-exito" id="avisoExito">Cuenta creada correctamente. Ya puedes iniciar sesión.</div>
    <div class="mensaje-error" id="avisoError">No encontramos ese DNI.</div>

    <form id="formLogin" onsubmit="iniciarSesion(); return false;">
      <label class="campo">
        <span class="icono" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        </span>
        <input id="dni" type="text" inputmode="numeric" name="dni" placeholder="DNI (8 dígitos)" maxlength="8" autocomplete="off" required>
      </label>

      <button type="submit" class="btn btn-primario" >Ingresar</button>
    </form>

    <div class="separador">No tengo una cuenta</div>

    <a href="registro.html" class="btn btn-secundario">Quiero registrarme</a>

    <p class="aviso-legal">Juega con responsabilidad. Prohibida la participación de menores de 18 años.</p>
  </div>

<script>
/* Inicio de sesión solo con DNI (demo en localStorage, sin backend). */
const CLAVE_ALMACEN = 'apuestaTotalCuentas';
const CLAVE_SESION = 'apuestaTotalSesion';

function obtenerCuentas(){
  try { return JSON.parse(localStorage.getItem(CLAVE_ALMACEN)) || []; }
  catch(e){ return []; }
}

if (new URLSearchParams(window.location.search).get('registrado') === '1'){
  document.getElementById('avisoExito').classList.add('visible');
}

document.getElementById('dni').addEventListener('input', e=>{
  e.target.value = e.target.value.replace(/\D/g, '');
});

function iniciarSesion(){
  const dni = document.getElementById('dni').value.trim();
  const avisoError = document.getElementById('avisoError');
  avisoError.classList.remove('visible');

  if (!/^\d{8}$/.test(dni)){
    avisoError.textContent = 'Ingresa un DNI válido de 8 dígitos.';
    avisoError.classList.add('visible');
    return;
  }
  const cuenta = obtenerCuentas().find(c => c.numeroDocumento === dni);
  if (!cuenta){
    avisoError.textContent = 'Ese DNI no está registrado. Regístrate primero.';
    avisoError.classList.add('visible');
    return;
  }
  localStorage.setItem(CLAVE_SESION, JSON.stringify({ dni: cuenta.numeroDocumento }));
  window.location.href = 'index.html';
}
</script>

</body>
</html>
