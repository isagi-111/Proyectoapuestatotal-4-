<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regístrate | Apuesta Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rojo:#E3242B;
    --coral:#F2867E;
    --coral-dark:#EC6F65;
    --negro:#17161B;
    --negro-suave:#2A2930;
    --teal:#1592A6;
    --gris-borde:#E3E2E6;
    --gris-fondo:#F6F5F7;
    --texto:#1B1A1F;
    --texto-sec:#6F6E76;
    --blanco:#FFFFFF;
    --verde:#1EA672;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    color:var(--texto);
    background:var(--blanco);
    position:relative;
    overflow-x:hidden;
  }

  /* Formas rojas decorativas a los costados, como en la referencia */
  .forma{position:fixed; z-index:-1; opacity:.9;}
  .forma-1{top:12%; left:-30px; width:70px; height:2px; background:var(--negro); transform:rotate(20deg);}
  .forma-2{top:60%; right:0; width:0; height:0; border-style:solid; border-width:0 90px 90px 0; border-color:transparent var(--rojo) transparent transparent;}
  .forma-3{bottom:14%; left:0; width:0; height:0; border-style:solid; border-width:0 0 90px 90px; border-color:transparent transparent var(--rojo) transparent;}
  .forma-4{bottom:8%; right:6%; width:60px; height:2px; background:var(--negro); transform:rotate(20deg);}
  @media(max-width:640px){.forma{display:none;}}

  .marca{display:flex; align-items:center; gap:.5rem; padding:1.25rem 1.5rem .5rem;}
  .marca a{
    display:flex; align-items:center; gap:.4rem;
    color:var(--rojo); text-decoration:none;
    font-family:'Anton', sans-serif; font-size:1.1rem; letter-spacing:.02em;
  }
  .marca svg{width:20px; height:20px; flex:none;}

  .tarjeta{
    max-width:560px; margin:0 auto; padding:1rem 1.5rem 3rem;
    position:relative; z-index:1;
  }

  /* ---- Progreso de pasos ---- */
  .progreso-etiqueta{
    text-align:center; text-transform:uppercase; letter-spacing:.08em;
    font-size:.8rem; font-weight:700; color:#C9C8CE; margin-bottom:.6rem;
  }
  .progreso-dots{display:flex; gap:.4rem; margin-bottom:1.6rem;}
  .progreso-dots span{flex:1; height:4px; border-radius:3px; background:var(--gris-borde);}
  .progreso-dots span.hecho, .progreso-dots span.activo{background:var(--rojo);}

  .paso{display:none;}
  .paso.visible{display:block;}

  .ilustracion{display:flex; justify-content:center; margin-bottom:1rem;}
  .ilustracion svg{width:220px; height:auto;}

  h1.titulo{
    font-family:'Anton', sans-serif; font-size:1.7rem; letter-spacing:.04em;
    text-align:center; margin:0 0 .3rem; text-transform:uppercase;
  }
  p.subtitulo{
    text-align:center; color:var(--texto-sec); font-size:.88rem; margin:0 0 1.5rem;
  }

  form{display:flex; flex-direction:column; gap:1rem;}
  .fila-2{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
  .fila-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem;}
  @media(max-width:560px){.fila-2, .fila-3{grid-template-columns:1fr;}}

  .campo{
    display:flex; align-items:center; gap:.6rem;
    border:1.5px solid var(--gris-borde); border-radius:10px;
    padding:.7rem .9rem; background:var(--blanco);
  }
  .campo:focus-within{border-color:var(--rojo);}
  .campo input, .campo select{
    border:0; outline:0; flex:1; width:100%;
    font:inherit; font-size:.92rem; background:transparent; color:var(--texto);
  }
  .campo select{appearance:none; cursor:pointer;}
  .campo input::placeholder{color:var(--texto-sec);}
  .campo .chevron, .campo .ver{
    flex:none; display:flex; color:var(--texto-sec); background:none; border:0; cursor:pointer; padding:0;
  }
  .campo .chevron{
    width:30px; height:30px; border-radius:50%; background:var(--gris-fondo);
    align-items:center; justify-content:center; pointer-events:none;
  }

  .campo-error{border-color:var(--rojo) !important;}
  .texto-ayuda{font-size:.76rem; color:var(--texto-sec); margin-top:-.5rem;}

  .fila-codigo{display:grid; grid-template-columns:1fr auto; gap:.7rem; align-items:stretch;}
  .btn-generar{
    background:var(--teal); color:var(--blanco); border:0; border-radius:10px;
    padding:0 1rem; font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap;
  }
  .btn-generar:hover{filter:brightness(1.05);}
  .btn-generar:disabled{opacity:.6; cursor:not-allowed;}

  .aviso-codigo{
    font-size:.78rem; background:#EAF7F4; border:1px solid #BFE8DF; color:#0F6E56;
    border-radius:8px; padding:.55rem .7rem; display:none;
  }
  .aviso-codigo.visible{display:block;}

  label.check{
    display:flex; align-items:flex-start; gap:.6rem;
    font-size:.82rem; color:var(--texto-sec); line-height:1.4;
  }
  label.check input{margin-top:.2rem;}
  label.check a{color:var(--rojo); text-decoration:underline;}

  .mensaje-error{
    font-size:.82rem; color:var(--rojo); background:#FDEDEE;
    border:1px solid #F6C9CB; border-radius:8px; padding:.6rem .8rem; display:none;
  }
  .mensaje-error.visible{display:block;}

  .btn{
    display:block; width:100%; text-align:center; border:0; cursor:pointer;
    padding:.95rem 1rem; font-family:'Anton', sans-serif; letter-spacing:.06em;
    font-size:1rem; text-transform:uppercase; text-decoration:none;
    clip-path:polygon(2.2% 0, 100% 0, 97.8% 100%, 0 100%);
    transition:filter .15s ease, transform .15s ease;
  }
  .btn:hover{filter:brightness(1.05); transform:translateY(-1px);}
  .btn-primario{background:var(--coral); color:var(--blanco);}
  .btn-primario:hover{background:var(--coral-dark);}

  .fila-botones{display:flex; gap:.8rem;}
  .btn-atras{
    flex:none; background:var(--gris-fondo); color:var(--texto);
    border:1.5px solid var(--gris-borde); border-radius:10px;
    padding:0 1.2rem; font-weight:700; font-size:.85rem; cursor:pointer;
  }

  .aviso-legal{text-align:center; font-size:.72rem; color:var(--texto-sec); margin-top:1.5rem; line-height:1.5;}
</style>
</head>
<body>

  <span class="forma forma-1"></span>
  <span class="forma forma-2"></span>
  <span class="forma forma-3"></span>
  <span class="forma forma-4"></span>

  <div class="marca">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
      Inicio
    </a>
  </div>

  <div class="tarjeta">

    <div class="ilustracion" aria-hidden="true">
      <svg viewBox="0 0 220 200">
        <circle cx="60" cy="120" r="46" fill="#BEE3F2"/>
        <rect x="95" y="35" width="60" height="120" rx="14" fill="#2A2930"/>
        <rect x="103" y="50" width="44" height="14" rx="4" fill="#F6F5F7"/>
        <rect x="103" y="70" width="44" height="14" rx="4" fill="#1592A6"/>
        <rect x="103" y="90" width="44" height="14" rx="4" fill="#F6F5F7"/>
        <circle cx="168" cy="60" r="20" fill="#F2867E"/>
        <rect x="150" y="80" width="36" height="60" rx="10" fill="#E3242B"/>
      </svg>
    </div>
    <h1 class="titulo">Regístrate</h1>
    <p class="subtitulo">Solo necesitas tu DNI</p>

    <div class="mensaje-error" id="error-1"></div>

    <form onsubmit="registrar(); return false;">
      <label class="campo">
        <input id="numeroDocumento" type="text" inputmode="numeric" placeholder="DNI (8 dígitos)" maxlength="8" autocomplete="off">
      </label>
      <button type="submit" class="btn btn-primario">Registrarme</button>
    </form>

    <p class="aviso-legal">Juega con responsabilidad. Prohibida la participación de menores de 18 años.</p>
  </div>

<script>
/* Registro con DNI únicamente (demo en localStorage, sin backend). */
const CLAVE_ALMACEN = 'apuestaTotalCuentas';

function obtenerCuentas(){
  try { return JSON.parse(localStorage.getItem(CLAVE_ALMACEN)) || []; }
  catch(e){ return []; }
}
function guardarCuenta(cuenta){
  const cuentas = obtenerCuentas();
  cuentas.push(cuenta);
  localStorage.setItem(CLAVE_ALMACEN, JSON.stringify(cuentas));
}
function existeDocumento(numero){
  return obtenerCuentas().some(c => c.numeroDocumento === numero);
}
function mostrarError(texto){
  const el = document.getElementById('error-1');
  el.textContent = texto;
  el.classList.add('visible');
}

// Solo permite dígitos mientras escribe
document.getElementById('numeroDocumento').addEventListener('input', e=>{
  e.target.value = e.target.value.replace(/\D/g, '');
});

function registrar(){
  const el = document.getElementById('error-1');
  el.classList.remove('visible');
  const dni = document.getElementById('numeroDocumento').value.trim();

  if (!/^\d{8}$/.test(dni)) return mostrarError('Ingresa un DNI válido de 8 dígitos.');
  if (existeDocumento(dni)) return mostrarError('Ese DNI ya está registrado.');

  guardarCuenta({ tipoDocumento: 'DNI', numeroDocumento: dni, creadoEn: new Date().toISOString() });
  window.location.href = 'login.html?registrado=1';
}
</script>

</body>
</html>
